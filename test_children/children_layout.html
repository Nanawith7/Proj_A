<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Recursive NodeView Layout Engine Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:12px sans-serif;background:#1a1a2e;color:#eee;display:flex;height:100vh;overflow:hidden}

#sidebar{width:340px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;overflow:hidden}
#sidebar h2{padding:10px 12px;color:#e94560;font-size:14px;border-bottom:1px solid #0f3460}

#tree-container{flex:1;overflow-y:auto;padding:8px}
#toolbar{display:flex;gap:4px;padding:8px;border-top:1px solid #0f3460;flex-wrap:wrap}
#toolbar button{background:#0f3460;color:#eee;border:1px solid #533460;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:11px}
#toolbar button:hover{background:#1a3a6e}

/* Tree nodes */
.tree-node{margin-left:12px}
.tree-node-header{display:flex;align-items:center;padding:2px 4px;border-radius:3px;cursor:pointer;gap:4px}
.tree-node-header:hover{background:#0f3460}
.tree-node-header.selected{background:#e94560;color:#fff}
.tree-toggle{width:14px;text-align:center;font-size:10px;color:#888;flex-shrink:0}
.tree-icon{width:12px;height:12px;border-radius:2px;flex-shrink:0;display:inline-block}
.tree-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.tree-delete{opacity:0;background:#c0392b;color:#fff;border:none;padding:1px 5px;border-radius:2px;cursor:pointer;font-size:10px}
.tree-node-header:hover .tree-delete{opacity:1}

/* Properties panel */
#props-panel{border-top:1px solid #0f3460;padding:8px;overflow-y:auto;max-height:45vh}
#props-panel h3{color:#e94560;font-size:12px;margin:8px 0 4px;border-bottom:1px solid #0f3460;padding-bottom:2px}
.prop-row{display:flex;gap:4px;margin:2px 0;align-items:center}
.prop-row label{color:#aaa;font-size:10px;min-width:50px;flex-shrink:0}
.prop-row input,.prop-row select{flex:1;padding:3px 6px;background:#0f3460;color:#eee;border:1px solid #533483;border-radius:3px;font-size:11px}
.prop-row input[type=color]{padding:0;width:36px;height:24px;cursor:pointer}

/* Canvas area */
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#0d1117}
#svg-canvas{display:block;max-width:100%;max-height:100%}

.el-drag-highlight{filter:brightness(1.3)}

#info-bar{position:absolute;bottom:8px;left:8px;background:#16213e88;padding:4px 10px;border-radius:4px;font-size:10px;color:#aaa;pointer-events:none}
#hover-info{position:absolute;top:8px;right:8px;background:#16213eaa;padding:6px 10px;border-radius:4px;font-size:10px;color:#aaa;pointer-events:none;font-family:monospace;display:none;white-space:pre;line-height:1.4}
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <h2>Recursive NodeView Layout Engine</h2>
  <div id="tree-container"></div>
  <div id="toolbar">
    <button onclick="addElement('box')">+ Box</button>
    <button onclick="addElement('circle')">+ Circle</button>
  </div>
  <div id="props-panel">
    <h3>Properties</h3>
    <div id="props-content"><span style="color:#666;font-size:11px">Select an element</span></div>
  </div>
</div>

<!-- Canvas -->
<div id="canvas-wrap">
  <svg id="svg-canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="info-bar">Click to select · Drag to move</div>
  <div id="hover-info"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// PHASE 1: DATA MODEL + LAYOUT ENGINE
// ═══════════════════════════════════════════════════════

let nextId = 1;

/**
 * Create a new element node.
 * Every element can have text, background image, and children independently.
 */
function makeEl(type, opts = {}) {
  return {
    id: nextId++,
    type,
    label: opts.label || (type === 'box' ? 'Box' : type === 'circle' ? 'Circle' : 'Text'),
    shape: type === 'circle' ? 'circle' : 'rect',
    rx: type === 'circle' ? 999 : (opts.rx || 6),
    fill: opts.fill || '#ffffff22',
    stroke: opts.stroke || '#ffffff88',
    strokeWidth: opts.strokeWidth ?? 1.5,
    // Text on EVERY element
    text: opts.text || '',
    fontSize: opts.fontSize || 11,
    textColor: opts.textColor || '#ffffffcc',
    textAlign: opts.textAlign || 'start',
    // Background image (every element can have one)
    bgImage: opts.bgImage || null,
    bgImgWidth: opts.bgImgWidth || 0,
    bgImgHeight: opts.bgImgHeight || 0,
    // Size: null = auto (computed from content), number = fixed px
    w: opts.w ?? null,
    h: opts.h ?? null,
    // Relative position to parent: "left-N", "right-N", "top-N", "bottom-N", "-N", or null=auto
    xRel: opts.xRel ?? null,
    yRel: opts.yRel ?? null,
    // Gap between siblings (vertical)
    gapY: opts.gapY ?? 5,
    // Children (nested elements)
    children: [],
    // Expanded state in tree view
    expanded: true,
    // Computed layout values (internal)
    _cw: 0, _ch: 0, _ax: 0, _ay: 0,
  };
}

// Root element containing everything
let root = makeEl('box', {
  label: 'Root Canvas',
  fill: '#1a1a2e',
  stroke: '#533483',
  w: null, h: null,
});

// Pre-populate with sample structure demonstrating nesting + relative positioning
root.children.push(
  makeEl('box', {
    label: 'Auto-Size Container',
    fill: '#2c3e6d',
    gapY: 5,
    children: [
      makeEl('box', {
        label: 'Centered Child (auto)',
        fill: '#34495e',
        text: 'This box auto-sizes to fit its text content',
        fontSize: 10,
        textColor: '#ffffffaa',
        children: [
          makeEl('circle', {
            label: 'Small Circle',
            fill: '#e9456044',
            stroke: '#e94560',
            text: '●',
            fontSize: 14,
          }),
        ],
      }),
      makeEl('box', {
        label: 'Right-Aligned Child',
        fill: '#8e44ad',
        xRel: 'right-10',
        text: 'Pinned to right edge',
        fontSize: 10,
        textColor: '#ffffffaa',
      }),
    ]
  }),
  makeEl('box', {
    label: 'Positioned Container',
    fill: '#3d2c6d',
    xRel: 'left-10',
    yRel: 'top-10',
    gapY: 5,
    children: [
      makeEl('circle', {
        label: 'Circle (centered)',
        fill: '#e9456044',
        stroke: '#e94560',
        text: 'Circle',
        fontSize: 10,
        textColor: '#ffffffcc',
      }),
      makeEl('box', {
        label: 'Bottom-Left Child',
        fill: '#1abc9c88',
        xRel: 'left-5',
        yRel: 'bottom-5',
        text: 'Bottom-left corner',
        fontSize: 9,
        textColor: '#ffffffcc',
      }),
    ]
  }),
  makeEl('box', {
    label: 'Outside Position Demo',
    fill: '#2d4a3e',
    xRel: 'left-10',
    yRel: 'top-10',
    gapY: 5,
    children: [
      makeEl('box', {
        label: 'Center (inside)',
        fill: '#1abc9c66',
        text: 'Inside parent',
        fontSize: 10,
        textColor: '#ffffffcc',
      }),
      makeEl('box', {
        label: 'Outside Right (right--20)',
        fill: '#e67e2288',
        xRel: 'right--20',
        text: '20px outside right',
        fontSize: 9,
        textColor: '#ffffffcc',
      }),
    ]
  })
);

let selectedId = null;
let dragState = null;

// ═── Text Measurement ────────────────────────────────
const _measureCanvas = document.createElement('canvas');
_measureCanvas.style.display = 'none';
document.body.appendChild(_measureCanvas);
const _measureCtx = _measureCanvas.getContext('2d');
function measureText(text, fontSize) {
  _measureCtx.font = `${fontSize}px sans-serif`;
  return _measureCtx.measureText(text).width;
}

// ═── Layout Pass 1: Measure (bottom-up) ─────────────
/**
 * Measure an element's natural size based on its content.
 * Returns {w, h}. Children get _cw/_ch set.
 */
function measureElement(el) {
  // If both dimensions are fixed, use them
  if (el.w !== null && el.h !== null) {
    const w = Math.max(el.w, 20);
    const h = Math.max(el.h, 20);
    el._cw = w;
    el._ch = h;
    return {w, h};
  }

  let maxChildW = 0, totalChildH = 0;
  const padX = 10, padY = 8;
  const gap = el.gapY || 5;

  if (el.children && el.children.length > 0) {
    for (const child of el.children) {
      const cm = measureElement(child);
      if (cm.w > maxChildW) maxChildW = cm.w;
      totalChildH += cm.h + gap;
    }
    if (el.children.length > 0) totalChildH -= gap; // remove last gap
  }

  // Text size contribution
  let textW = 0, textH = 0;
  if (el.text) {
    textW = measureText(el.text, el.fontSize) + 16;
    textH = (el.fontSize || 11) + 8;
  }

  // Compute element size
  let w, h;
  if (el.w !== null) {
    w = Math.max(el.w, 20);
  } else {
    w = Math.max(maxChildW, textW) + padX * 2;
  }
  if (el.h !== null) {
    h = Math.max(el.h, 20);
  } else {
    h = Math.max(totalChildH, textH) + padY * 2;
  }

  el._cw = w;
  el._ch = h;
  return {w, h};
}

// ═── Layout Pass 2: Resolve Positions (top-down) ────
/**
 * Parse relative position string.
 * Returns {dir, val} or null.
 */
function parseRelative(rel) {
  if (rel === null || rel === undefined || rel === '') return null;
  const s = String(rel);
  // Support negative offsets for outside-parent positioning (e.g., left--10, right--20)
  const leftM = s.match(/^left-(-?\d+)$/);
  if (leftM) { const v = parseInt(leftM[1]); return {dir: 'left', val: v, isOutside: v < 0}; }
  const rightM = s.match(/^right-(-?\d+)$/);
  if (rightM) { const v = parseInt(rightM[1]); return {dir: 'right', val: v, isOutside: v < 0}; }
  const topM = s.match(/^top-(-?\d+)$/);
  if (topM) { const v = parseInt(topM[1]); return {dir: 'top', val: v, isOutside: v < 0}; }
  const bottomM = s.match(/^bottom-(-?\d+)$/);
  if (bottomM) { const v = parseInt(bottomM[1]); return {dir: 'bottom', val: v, isOutside: v < 0}; }
  // Absolute offset from parent origin (can be negative)
  const numM = s.match(/^-?\d+$/);
  if (numM) return {dir: 'abs', val: parseInt(numM[0]), isOutside: false};
  return null;
}

/**
  * Resolve a relative position to an offset from parent origin.
  */
  function resolveRelX(parsed, parentW, childW) {
    if (!parsed) return (parentW - childW) / 2; // center from parent left edge
    switch (parsed.dir) {
      case 'left':   return parsed.val;
      case 'right':  return parentW - parsed.val - childW;
      case 'abs':    return parsed.val;
      default:       return 0;
    }
  }

  function resolveRelY(parsed, parentH, childH) {
    if (!parsed) return 0; // top (offset from parent top edge)
    switch (parsed.dir) {
      case 'top':     return parsed.val;
      case 'bottom':  return parentH - parsed.val - childH;
      case 'abs':     return parsed.val;
      default:        return 0;
    }
  }

/**
  * Resolve positions for all children of a parent.
  * Two-pass approach:
  *   Pass 1: Position "inside" children (positive offset or auto) → expand parent to fit
  *   Pass 2: Position "outside" children (negative offset) → use fixed parent size
  */
  function resolvePositions(parent) {
    if (!parent.children || parent.children.length === 0) return;

    // Ensure all children are measured first
    for (const child of parent.children) {
      if (child._cw === 0 && child._ch === 0) {
        measureElement(child);
      }
    }

    const padX = 10, padY = 8;

    // ── Pass 1: Position "inside" children only ──
    let curY = parent._ay + padY; // starting Y for auto-stacked children
    let maxX = 0, maxY = 0;

    for (const child of parent.children) {
      const parsedX = parseRelative(child.xRel);
      const parsedY = parseRelative(child.yRel);

      // Skip "outside" children in pass 1
      if ((parsedX && parsedX.isOutside) || (parsedY && parsedY.isOutside)) continue;

      // Resolve X: offset from parent origin, then add parent absolute position
      const offsetX = resolveRelX(parsedX, parent._cw || 0, child._cw || 0);
      child._ax = (parent._ax || 0) + offsetX;

      // Resolve Y: if yRel is specified, use it; otherwise stack vertically
      if (parsedY) {
        const offsetY = resolveRelY(parsedY, parent._ch || 0, child._ch || 0);
        child._ay = (parent._ay || 0) + offsetY;
      } else {
        child._ay = curY;
        curY += (child._ch || 0) + (parent.gapY || 5);
      }

      // Track bounding box for parent expansion
      const childRight = (child._ax || 0) - (parent._ax || 0) + (child._cw || 0);
      const childBottom = (child._ay || 0) - (parent._ay || 0) + (child._ch || 0);
      if (childRight > maxX) maxX = childRight;
      if (childBottom > maxY) maxY = childBottom;

      // Recurse into children
      resolvePositions(child);
    }

    // Expand auto-sized parent based on "inside" children only
    if (parent.w === null) {
      parent._cw = Math.max(parent._cw || 40, maxX + padX * 2, 40);
    }
    if (parent.h === null) {
      parent._ch = Math.max(parent._ch || 30, maxY + padY * 2, 30);
    }

    // ── Pass 2: Position "outside" children using fixed parent size ──
    for (const child of parent.children) {
      const parsedX = parseRelative(child.xRel);
      const parsedY = parseRelative(child.yRel);

      // Skip "inside" children (already positioned in pass 1)
      if (!(parsedX && parsedX.isOutside) && !(parsedY && parsedY.isOutside)) continue;

      // Resolve X
      const offsetX = resolveRelX(parsedX, parent._cw || 0, child._cw || 0);
      child._ax = (parent._ax || 0) + offsetX;

      // Resolve Y
      if (parsedY) {
        const offsetY = resolveRelY(parsedY, parent._ch || 0, child._ch || 0);
        child._ay = (parent._ay || 0) + offsetY;
      } else {
        // No yRel specified but xRel is outside → center vertically
        child._ay = (parent._ay || 0) + (parent._ch - (child._ch || 0)) / 2;
      }

      // Recurse into children
      resolvePositions(child);
    }
  }

/**
 * Full layout: measure all, resolve all positions.
 */
function computeLayout() {
  measureElement(root);
  resolvePositions(root);
}

// ═══════════════════════════════════════════════════════
// PHASE 2: SVG RENDERING
// ═══════════════════════════════════════════════════════

const SVG_NS = 'http://www.w3.org/2000/svg';
const svgCanvas = document.getElementById('svg-canvas');

/**
 * Render a single element and its children to SVG.
 */
function drawElement(el, parentGroup, offsetX, offsetY) {
  const x = (offsetX || 0) + (el._ax || 0);
  const y = (offsetY || 0) + (el._ay || 0);
  const w = el._cw || 0;
  const h = el._ch || 0;

  // Create group for this element
  const g = document.createElementNS(SVG_NS, 'g');
  g.classList.add('el-group');
  g.dataset.id = el.id;

  // Draw background image if set (BEFORE shape so it appears underneath)
  if (el.bgImage && w > 0 && h > 0) {
    const img = document.createElementNS(SVG_NS, 'image');
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', el.bgImage);
    img.setAttribute('x', x);
    img.setAttribute('y', y);
    img.setAttribute('width', w);
    img.setAttribute('height', h);
    img.style.pointerEvents = 'none';
    
    console.log(`[drawElement] bgImage: "${el.label}" x=${x} y=${y} w=${w} h=${h} srcLen=${el.bgImage.length}`);
    
    img.addEventListener('error', () => {
      console.error(`[drawElement] BG IMAGE ERROR: "${el.label}" src=${el.bgImage.substring(0, 40)}...`);
    });
    img.addEventListener('load', () => {
      console.log(`[drawElement] BG IMAGE LOADED: "${el.label}"`);
    });
    
    g.appendChild(img);
  }

  // Draw shape (on top of background image)
  if (el.shape === 'circle') {
    const size = Math.max(w, h);
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', x + (w - size) / 2);
    rect.setAttribute('y', y + (h - size) / 2);
    rect.setAttribute('width', size);
    rect.setAttribute('height', size);
    rect.setAttribute('fill', el.fill || '#ffffff22');
    rect.setAttribute('stroke', el.stroke || '#fff6');
    rect.setAttribute('stroke-width', el.strokeWidth ?? 1.5);
    rect.setAttribute('rx', '999');
    rect.setAttribute('ry', '999');
    if (el.id === selectedId) {
      rect.setAttribute('stroke', '#e94560');
      rect.setAttribute('stroke-width', '2.5');
    }
    g.appendChild(rect);
  } else {
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.classList.add('el-rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('fill', el.fill || '#ffffff22');
    rect.setAttribute('stroke', el.stroke || '#fff6');
    rect.setAttribute('stroke-width', el.strokeWidth ?? 1.5);
    rect.setAttribute('rx', el.rx || 4);
    rect.setAttribute('ry', el.rx || 4);
    if (el.id === selectedId) {
      rect.classList.add('el-drag-highlight');
      rect.setAttribute('stroke', '#e94560');
      rect.setAttribute('stroke-width', '2.5');
    }
    g.appendChild(rect);
  }

  // Draw text (every element can have text)
  if (el.text) {
    const txt = document.createElementNS(SVG_NS, 'text');
    txt.classList.add('el-text');
    let tx = x + 8;
    if (el.textAlign === 'middle') tx = x + w / 2;
    else if (el.textAlign === 'end') tx = x + w - 8;
    txt.setAttribute('x', tx);
    txt.setAttribute('y', y + (el.fontSize || 11) + 4);
    txt.setAttribute('fill', el.textColor || '#ffffffcc');
    txt.setAttribute('font-size', el.fontSize || 11);
    if (el.textAlign === 'middle') txt.setAttribute('text-anchor', 'middle');
    else if (el.textAlign === 'end') txt.setAttribute('text-anchor', 'end');
    txt.textContent = el.text;
    g.appendChild(txt);
  }

  // Selection highlight
  if (el.id === selectedId) {
    const selRect = document.createElementNS(SVG_NS, 'rect');
    selRect.setAttribute('x', x - 2);
    selRect.setAttribute('y', y - 2);
    selRect.setAttribute('width', w + 4);
    selRect.setAttribute('height', h + 4);
    selRect.setAttribute('fill', 'none');
    selRect.setAttribute('stroke', '#e94560');
    selRect.setAttribute('stroke-width', '2');
    selRect.setAttribute('rx', '8');
    selRect.setAttribute('pointer-events', 'none');
    g.appendChild(selRect);

    // Resize handles
    const hs = 6;
    [[x - hs/2, y - hs/2], [x + w - hs/2, y - hs/2],
     [x - hs/2, y + h - hs/2], [x + w - hs/2, y + h - hs/2]].forEach(([hx, hy]) => {
      const h2 = document.createElementNS(SVG_NS, 'rect');
      h2.setAttribute('x', hx); h2.setAttribute('y', hy);
      h2.setAttribute('width', hs); h2.setAttribute('height', hs);
      h2.setAttribute('fill', '#e94560'); h2.setAttribute('rx', '2');
      h2.setAttribute('pointer-events', 'none');
      g.appendChild(h2);
    });
  }

  // Recursively render children
  if (el.children && el.children.length > 0) {
    for (const child of el.children) {
      drawElement(child, g, offsetX || 0, offsetY || 0);
    }
  }

  parentGroup.appendChild(g);
}

/**
 * Full render: compute layout and draw SVG.
 */
function render(skipLayout) {
  if (!skipLayout) {
    computeLayout();
  }
  svgCanvas.innerHTML = '';
  const mainG = document.createElementNS(SVG_NS, 'g');
  drawElement(root, mainG, 0, 0);
  svgCanvas.appendChild(mainG);

  // Set viewBox to fit all
  const vbW = root._cw || 400;
  const vbH = root._ch || 300;
  svgCanvas.setAttribute('viewBox', `0 0 ${vbW} ${vbH}`);
  svgCanvas.style.width = Math.max(vbW, 200) + 'px';
  svgCanvas.style.height = Math.max(vbH, 150) + 'px';
}

// ═══════════════════════════════════════════════════════
// PHASE 3: EDITOR UI - Tree View
// ═══════════════════════════════════════════════════════

const treeContainer = document.getElementById('tree-container');

function renderTree() {
  treeContainer.innerHTML = '';
  renderTreeNode(root, treeContainer);
}

function renderTreeNode(el, parentDiv) {
  const nodeDiv = document.createElement('div');
  nodeDiv.classList.add('tree-node');

  const header = document.createElement('div');
  header.classList.add('tree-node-header');
  if (el.id === selectedId) header.classList.add('selected');

  // Toggle arrow
  const toggle = document.createElement('span');
  toggle.classList.add('tree-toggle');
  toggle.textContent = el.children && el.children.length > 0 ? (el.expanded ? '▼' : '▶') : ' ';
  if (el.children && el.children.length > 0) {
    toggle.onclick = (e) => { e.stopPropagation(); el.expanded = !el.expanded; renderTree(); };
  }
  header.appendChild(toggle);

  // Color indicator
  const icon = document.createElement('span');
  icon.classList.add('tree-icon');
  icon.style.background = el.fill;
  header.appendChild(icon);

  // Label with position info
  let label = el.label;
  if (el.xRel || el.yRel) {
    label += ` [${el.xRel || 'auto'},${el.yRel || 'auto'}]`;
  } else if (el.w === null && el.h === null) {
    label += ' [auto]';
  }
  const labelEl = document.createElement('span');
  labelEl.classList.add('tree-label');
  labelEl.textContent = label;
  header.appendChild(labelEl);

  // Delete button (not for root)
  if (el.id !== root.id) {
    const delBtn = document.createElement('button');
    delBtn.classList.add('tree-delete');
    delBtn.textContent = '×';
    delBtn.onclick = (e) => { e.stopPropagation(); removeElement(el.id); };
    header.appendChild(delBtn);
  }

  // Click to select
  header.onclick = () => {
    selectedId = el.id;
    renderTree();
    renderProps();
    render();
  };

  nodeDiv.appendChild(header);

  // Children
  if (el.children && el.children.length > 0 && el.expanded) {
    for (const child of el.children) {
      renderTreeNode(child, nodeDiv);
    }
  }

  parentDiv.appendChild(nodeDiv);
}

// ═══════════════════════════════════════════════════════
// PHASE 3: EDITOR UI - Properties Panel
// ═══════════════════════════════════════════════════════

const propsContent = document.getElementById('props-content');

/**
 * Create a property row with an input and attach event listener.
 * Uses DOM API (not innerHTML) so closures can access `el`.
 */
function propRow(label, value, onChange) {
  const div = document.createElement('div');
  div.className = 'prop-row';

  const lbl = document.createElement('label');
  lbl.textContent = label;

  const input = document.createElement('input');
  input.value = value;
  input.addEventListener('input', () => onChange(input.value));

  div.appendChild(lbl);
  div.appendChild(input);
  return div;
}

function renderProps() {
  const el = findElement(selectedId);
  if (!el) {
    propsContent.innerHTML = '<span style="color:#666;font-size:11px">Select an element</span>';
    return;
  }

  propsContent.innerHTML = '';

  // Label
  propsContent.appendChild(propRow('Label', el.label, (v) => { el.label = v; renderTree(); render(); }));

  // Type
  const typeRow = document.createElement('div');
  typeRow.className = 'prop-row';
  typeRow.innerHTML = `<label>Type</label><span style="color:#e94560;font-size:11px">${el.shape}</span>`;
  propsContent.appendChild(typeRow);

  // Size
  const wInput = propRow('Width', el.w !== null ? el.w : 'auto', (v) => { el.w = v === 'auto' ? null : parseInt(v) || 0; render(); });
  propsContent.appendChild(wInput);
  const hInput = propRow('Height', el.h !== null ? el.h : 'auto', (v) => { el.h = v === 'auto' ? null : parseInt(v) || 0; render(); });
  propsContent.appendChild(hInput);

  // Relative position
  const xRelRow = document.createElement('div');
  xRelRow.className = 'prop-row';
  const xRelLbl = document.createElement('label');
  xRelLbl.textContent = 'X Rel';
  const xRelInput = document.createElement('input');
  xRelInput.value = el.xRel ?? '';
  xRelInput.placeholder = 'left-10, right--10(外側), -10';
  xRelInput.addEventListener('input', () => { el.xRel = xRelInput.value || null; renderTree(); render(); });
  xRelRow.appendChild(xRelLbl);
  xRelRow.appendChild(xRelInput);
  propsContent.appendChild(xRelRow);

  const yRelRow = document.createElement('div');
  yRelRow.className = 'prop-row';
  const yRelLbl = document.createElement('label');
  yRelLbl.textContent = 'Y Rel';
  const yRelInput = document.createElement('input');
  yRelInput.value = el.yRel ?? '';
  yRelInput.placeholder = 'top-5, bottom--10(外側), -10';
  yRelInput.addEventListener('input', () => { el.yRel = yRelInput.value || null; renderTree(); render(); });
  yRelRow.appendChild(yRelLbl);
  yRelRow.appendChild(yRelInput);
  propsContent.appendChild(yRelRow);

  // Fill
  const fillRow = propRow('Fill', el.fill, (v) => { el.fill = v; render(); });
  propsContent.appendChild(fillRow);

  // Stroke
  const strokeRow = propRow('Stroke', el.stroke, (v) => { el.stroke = v; render(); });
  propsContent.appendChild(strokeRow);

  // Text properties
  const textRow = document.createElement('div');
  textRow.className = 'prop-row';
  const textLbl = document.createElement('label');
  textLbl.textContent = 'Text';
  const textInput = document.createElement('input');
  textInput.value = el.text;
  textInput.placeholder = 'text content';
  textInput.addEventListener('input', () => { el.text = textInput.value; renderTree(); render(); });
  textRow.appendChild(textLbl);
  textRow.appendChild(textInput);
  propsContent.appendChild(textRow);

  const fontSizeRow = propRow('Font Size', el.fontSize, (v) => { el.fontSize = parseInt(v) || 11; render(); });
  propsContent.appendChild(fontSizeRow);

  const textColorRow = propRow('Text Color', el.textColor, (v) => { el.textColor = v; render(); });
  propsContent.appendChild(textColorRow);

  // Gap
  const gapRow = propRow('Gap', el.gapY, (v) => { el.gapY = parseInt(v) || 5; render(); });
  propsContent.appendChild(gapRow);

  // Children count + Add Child buttons
  const childCountRow = document.createElement('div');
  childCountRow.className = 'prop-row';
  const ccLbl = document.createElement('label');
  ccLbl.textContent = 'Children';
  const ccSpan = document.createElement('span');
  ccSpan.style.cssText = 'color:#aaa;font-size:11px';
  ccSpan.textContent = el.children ? el.children.length : 0;
  childCountRow.appendChild(ccLbl);
  childCountRow.appendChild(ccSpan);
  propsContent.appendChild(childCountRow);

  if (el.id !== root.id) {
    const btnRow = document.createElement('div');
    btnRow.className = 'prop-row';
    const boxBtn = document.createElement('button');
    boxBtn.textContent = '+ Box子';
    boxBtn.style.cssText = 'flex:1;background:#0f3460;color:#eee;border:1px solid #533460;padding:3px 6px;border-radius:3px;cursor:pointer;font-size:10px';
    boxBtn.addEventListener('click', () => addSelectedChild('box'));
    const circBtn = document.createElement('button');
    circBtn.textContent = '+ Circle子';
    circBtn.style.cssText = 'flex:1;background:#0f3460;color:#eee;border:1px solid #533460;padding:3px 6px;border-radius:3px;cursor:pointer;font-size:10px';
    circBtn.addEventListener('click', () => addSelectedChild('circle'));
    btnRow.appendChild(boxBtn);
    btnRow.appendChild(circBtn);
    propsContent.appendChild(btnRow);
  }

  // Background image section
  const bgImgLabel = document.createElement('div');
  bgImgLabel.className = 'prop-row';
  const bgLbl = document.createElement('label');
  bgLbl.textContent = 'BgImage';
  bgImgLabel.appendChild(bgLbl);
  propsContent.appendChild(bgImgLabel);

  if (el.bgImage) {
    const bgInfoRow = document.createElement('div');
    bgInfoRow.className = 'prop-row';
    const bgSpan = document.createElement('span');
    bgSpan.style.cssText = 'color:#4ecdc4;font-size:10px;flex:1';
    let infoText = `✓ loaded (${Math.round(el.bgImage.length / 1024)}KB)`;
    if (el.bgImgWidth > 0) infoText += ` ${el.bgImgWidth}x${el.bgImgHeight}`;
    bgSpan.textContent = infoText;
    const bgClearBtn = document.createElement('button');
    bgClearBtn.textContent = 'Clear';
    bgClearBtn.style.cssText = 'background:#c0392b;color:#fff;border:none;padding:2px 8px;border-radius:2px;cursor:pointer;font-size:10px';
    bgClearBtn.addEventListener('click', () => { el.bgImage = null; el.bgImgWidth = 0; el.bgImgHeight = 0; renderProps(); render(); });
    bgInfoRow.appendChild(bgSpan);
    bgInfoRow.appendChild(bgClearBtn);
    propsContent.appendChild(bgInfoRow);
  } else {
    const bgFileRow = document.createElement('div');
    bgFileRow.className = 'prop-row';
    const bgFileInput = document.createElement('input');
    bgFileInput.type = 'file';
    bgFileInput.accept = 'image/*';
    bgFileInput.style.cssText = 'flex:1;font-size:10px';
    bgFileInput.addEventListener('change', () => loadBgImage(bgFileInput));
    bgFileRow.appendChild(bgFileInput);
    propsContent.appendChild(bgFileRow);
  }
}

// ═══════════════════════════════════════════════════════
// ELEMENT OPERATIONS
// ═══════════════════════════════════════════════════════

function findElement(id, el = root) {
  if (el.id === id) return el;
  if (el.children) {
    for (const c of el.children) {
      const found = findElement(id, c);
      if (found) return found;
    }
  }
  return null;
}

function findParent(id, parent = root) {
  if (!parent.children) return null;
  for (const c of parent.children) {
    if (c.id === id) return parent;
    const found = findParent(id, c);
    if (found) return found;
  }
  return null;
}

function removeElement(id) {
  const parent = findParent(id);
  if (parent) {
    parent.children = parent.children.filter(c => c.id !== id);
    if (selectedId === id) selectedId = null;
    renderTree();
    renderProps();
    render();
  }
}

function addElement(type, parentEl = root) {
  const newEl = makeEl(type);
  if (!parentEl.children) parentEl.children = [];
  parentEl.children.push(newEl);
  selectedId = newEl.id;
  parentEl.expanded = true;
  renderTree();
  renderProps();
  render();
}

/**
 * Add a child to the currently selected element.
 */
function addSelectedChild(type) {
  const parent = findElement(selectedId);
  if (!parent || selectedId === root.id) return;
  const newEl = makeEl(type);
  if (!parent.children) parent.children = [];
  parent.children.push(newEl);
  selectedId = newEl.id;
  parent.expanded = true;
  renderTree();
  renderProps();
  render();
}

/**
  * Load a background image from local file.
  * Gets image dimensions and sets auto-sizing with aspect ratio.
  */
  function loadBgImage(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const el = findElement(selectedId);
      if (!el) return;
      
      // Load image to get dimensions
      const img = new Image();
      img.onload = () => {
        el.bgImage = e.target.result;
        el.bgImgWidth = img.width;
        el.bgImgHeight = img.height;
        
        // If element has fixed width, compute height to maintain aspect ratio
        if (el.w !== null && el.w > 0) {
          el.h = Math.round(el.w * (img.height / img.width));
        } else {
          // Auto-size to image dimensions
          el.w = img.width;
          el.h = img.height;
        }
        
        renderProps();
        render();
      };
      img.onerror = () => {
        console.error('Failed to load background image');
        el.bgImage = null;
        renderProps();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

/**
 * Remove the background image from selected element.
 */
function clearBgImage() {
  const el = findElement(selectedId);
  if (el) {
    el.bgImage = null;
    renderProps();
    render();
  }
}

// ═══════════════════════════════════════════════════════
// PHASE 4: DRAG AND DROP
// ═══════════════════════════════════════════════════════

const canvasWrap = document.getElementById('canvas-wrap');

function getSVGPoint(e) {
  const rect = svgCanvas.getBoundingClientRect();
  const vb = svgCanvas.viewBox.baseVal;
  const scaleX = vb.width / rect.width;
  const scaleY = vb.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY,
  };
}

function findElementAt(x, y, el) {
  // Check children first (top-most element wins)
  if (el.children) {
    for (let i = el.children.length - 1; i >= 0; i--) {
      const child = el.children[i];
      if (child._ax !== undefined && x >= child._ax && x <= child._ax + (child._cw || 0) &&
          child._ay !== undefined && y >= child._ay && y <= child._ay + (child._ch || 0)) {
        const found = findElementAt(x, y, child);
        if (found) return found;
      }
    }
  }
  // Check this element
  if (el._ax !== undefined && x >= el._ax && x <= el._ax + (el._cw || 0) &&
      el._ay !== undefined && y >= el._ay && y <= el._ay + (el._ch || 0)) {
    return el;
  }
  return null;
}

svgCanvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const pt = getSVGPoint(e);

  const el = findElementAt(pt.x, pt.y, root);
  if (el) {
    selectedId = el.id;
    dragState = {
      id: el.id,
      startAx: el._ax || 0,
      startAy: el._ay || 0,
      mouseX: pt.x,
      mouseY: pt.y,
    };
    renderTree();
    renderProps();
    e.preventDefault();
  } else {
    selectedId = null;
    renderTree();
    renderProps();
    render();
  }
});

window.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  const pt = getSVGPoint(e);
  const el = findElement(dragState.id);
  if (!el) { dragState = null; return; }

  const dx = pt.x - dragState.mouseX;
  const dy = pt.y - dragState.mouseY;
  el._ax = dragState.startAx + dx;
  el._ay = dragState.startAy + dy;

  // Update xRel/yRel to reflect new position relative to parent
  const parent = findParent(el.id);
  if (parent) {
    el.xRel = String(Math.round(el._ax - (parent._ax || 0)));
    el.yRel = String(Math.round(el._ay - (parent._ay || 0)));
  }

  render(true); // skip layout during drag
});

window.addEventListener('mouseup', () => {
  if (dragState) {
    dragState = null;
    render(); // recompute layout after drag
  }
});

// Hover info
const hoverInfo = document.getElementById('hover-info');
svgCanvas.addEventListener('mousemove', (e) => {
  if (dragState) return;
  const pt = getSVGPoint(e);
  const el = findElementAt(pt.x, pt.y, root);
  if (el && el._cw > 0) {
    hoverInfo.style.display = 'block';
    hoverInfo.textContent = `${el.label}\nx:${Math.round(el._ax)} y:${Math.round(el._ay)}\nw:${Math.round(el._cw)} h:${Math.round(el._ch)}\nxRel:${el.xRel ?? 'auto'} yRel:${el.yRel ?? 'auto'}`;
  } else {
    hoverInfo.style.display = 'none';
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' && selectedId !== null && selectedId !== root.id) {
    removeElement(selectedId);
  }
  if (e.key === 'Escape') {
    selectedId = null;
    renderTree();
    renderProps();
    render();
  }
});

// ═══════════════════════════════════════════════════════
// UNIT TESTS: Position parsing and resolution
// ═══════════════════════════════════════════════════════
function runPositionTests() {
  console.log('=== Position Parsing Tests ===');

  // parseRelative tests (with isOutside flag)
  let tests = [
    ['left-10', {dir: 'left', val: 10, isOutside: false}],
    ['right-5', {dir: 'right', val: 5, isOutside: false}],
    ['top-3', {dir: 'top', val: 3, isOutside: false}],
    ['bottom-8', {dir: 'bottom', val: 8, isOutside: false}],
    ['-10', {dir: 'abs', val: -10, isOutside: false}],
    ['15', {dir: 'abs', val: 15, isOutside: false}],
    [null, null],
    ['', null],
    ['invalid', null],
    // Negative offset tests (outside parent)
    ['left--10', {dir: 'left', val: -10, isOutside: true}],
    ['right--10', {dir: 'right', val: -10, isOutside: true}],
    ['top--5', {dir: 'top', val: -5, isOutside: true}],
    ['bottom--8', {dir: 'bottom', val: -8, isOutside: true}],
  ];

  for (const [input, expected] of tests) {
    const result = parseRelative(input);
    const pass = JSON.stringify(result) === JSON.stringify(expected);
    console.log(`parseRelative(${JSON.stringify(input)}) => ${JSON.stringify(result)} ${pass ? '✓' : '✗ FAIL'}`);
  }

  // resolveRelX tests
  console.log('\n=== resolveRelX Tests (parentW=400) ===');
  const pw = 400;
  [
    [parseRelative('left-10'), 10, 'left-10 with childW=100'],
    [parseRelative('right-10'), 290, 'right-10 with childW=100'],
    [parseRelative('-5'), -5, '-5 (overflow left) with childW=100'],
    [null, 150, 'center with childW=100'],
    // Negative offset tests (outside parent)
    [parseRelative('left--20'), -20, 'left--20 (20px outside left edge) with childW=100'],
    [parseRelative('right--20'), 420, 'right--20 (20px outside right edge) with childW=100'],
  ].forEach(([parsed, expected, desc]) => {
    const result = resolveRelX(parsed, pw, 100);
    const pass = Math.abs(result - expected) < 0.01;
    console.log(`${desc}: ${result} ${pass ? '✓' : '✗ FAIL (expected ' + expected + ')'}`);
  });

  // resolveRelY tests
  console.log('\n=== resolveRelY Tests (parentH=300) ===');
  const ph = 300;
  [
    [parseRelative('top-5'), 5, 'top-5 with childH=30'],
    [parseRelative('bottom-10'), 260, 'bottom-10 with childH=30'],
    [null, 0, 'top (default) with childH=30'],
    // Negative offset tests (outside parent)
    [parseRelative('top--20'), -20, 'top--20 (20px outside top edge) with childH=50'],
    [parseRelative('bottom--20'), 310, 'bottom--20 (20px outside bottom edge) with childH=50'],
  ].forEach(([parsed, expected, desc]) => {
    const result = resolveRelY(parsed, ph, 30);
    const pass = Math.abs(result - expected) < 0.01;
    console.log(`${desc}: ${result} ${pass ? '✓' : '✗ FAIL (expected ' + expected + ')'}`);
  });

  // Integration test: two-pass positioning (inside vs outside children)
  console.log('\n=== Two-Pass Positioning Test ===');
  
  // Create a test parent with inside and outside children
  const testParent = makeEl('box', { label: 'Test Parent', w: null, h: null, fill: '#111' });
  testParent._ax = 0; testParent._ay = 0;
  
  // Inside child (should expand parent)
  const insideChild = makeEl('box', { label: 'Inside Child', text: 'Inside', w: 80, h: 30, fill: '#222' });
  testParent.children.push(insideChild);
  
  // Outside child (right--30 = 30px outside right edge)
  const outsideChild = makeEl('box', { label: 'Outside Child', text: 'Out', w: 60, h: 25, fill: '#333', xRel: 'right--30' });
  testParent.children.push(outsideChild);
  
  // Measure first
  measureElement(testParent);
  console.log(`After measure: parent _cw=${testParent._cw}, _ch=${testParent._ch}`);
  
  // Resolve positions
  resolvePositions(testParent);
  console.log(`After resolve:`);
  console.log(`  Inside child: _ax=${insideChild._ax}, _ay=${insideChild._ay}, _cw=${insideChild._cw}, _ch=${insideChild._ch}`);
  console.log(`  Outside child: _ax=${outsideChild._ax}, _ay=${outsideChild._ay}, _cw=${outsideChild._cw}, _ch=${outsideChild._ch}`);
  console.log(`  Parent: _cw=${testParent._cw}, _ch=${testParent._ch}`);
  
  // Verify: parent should NOT expand to include outside child
  const insideRight = insideChild._ax + insideChild._cw;
  const outsideRight = outsideChild._ax + outsideChild._cw;
  console.log(`  Inside right edge: ${insideRight}`);
  console.log(`  Outside right edge: ${outsideRight}`);
  console.log(`  Parent width: ${testParent._cw}`);
  
  // Check that outside child is positioned relative to parent's right edge
  const expectedOutsideAx = testParent._cw + 30; // parent right edge + 30px
  const passOutside = Math.abs(outsideChild._ax - expectedOutsideAx) < 1;
  console.log(`  Outside child ax=${outsideChild._ax} (expected ${expectedOutsideAx}) ${passOutside ? '✓' : '✗ FAIL'}`);
  
  // Check that parent width is based on inside child only (not outside)
  const expectedParentW = Math.max(insideRight + 20, 40); // inside child right + padding
  const passParentSize = testParent._cw <= expectedOutsideAx; // parent should NOT include outside child
  console.log(`  Parent width=${testParent._cw} (should be < ${expectedOutsideAx}) ${passParentSize ? '✓' : '✗ FAIL'}`);
}

// ═══════════════════════════════════════════════════════
// DEBUG: Print layout tree with computed values
// ═══════════════════════════════════════════════════════
function debugPrintLayout(el, depth = 0) {
  const indent = '  '.repeat(depth);
  const rel = el.xRel !== null || el.yRel !== null ? ` [xRel=${el.xRel ?? 'null'}, yRel=${el.yRel ?? 'null'}]` : '';
  const size = `w=${el.w === null ? 'auto' : el.w}, h=${el.h === null ? 'auto' : el.h}`;
  const computed = ` → _ax=${Math.round(el._ax)}, _ay=${Math.round(el._ay)}, _cw=${Math.round(el._cw)}, _ch=${Math.round(el._ch)}`;
  console.log(`${indent}${el.label}(${el.shape}) ${size}${rel}${computed}`);
  if (el.children) {
    for (const child of el.children) {
      debugPrintLayout(child, depth + 1);
    }
  }
}

renderTree();
renderProps();
render();
runPositionTests();
console.log('\n=== Layout Debug ===');
debugPrintLayout(root);

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Viewer</title>
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<div id="graph"></div>
<div id="sidebar">
  <h3>Filter</h3>
  <div id="filter-rows"></div>
  <button onclick="addRow('filter-rows')">+ Filter</button>
  <h3>Base Node</h3>
  <label>Start from <input type="text" id="base-node" placeholder="node stem"></label>
  <label>Depth <input type="number" id="depth" value="" min="0" max="5" placeholder="hops"></label>
  <h3>Exclude</h3>
  <div id="exclude-rows"></div>
  <button onclick="addRow('exclude-rows')">+ Exclude</button>
  <h3>Sort</h3>
  <select id="sort-key"><option value="">none</option></select>
  <label style="display:inline;margin-left:6px"><input type="checkbox" id="sort-desc"> desc</label>
  <h3>Prune</h3>
  <label><input type="checkbox" id="prune-orphans"> Remove orphans</label>
  <h3>Expand</h3>
  <label><select id="expand-mode"><option value="wrap">Wrap text</option><option value="stretch">Stretch to fit</option></select></label>
  <div style="margin-top:10px"><button onclick="apply()">Apply</button><button onclick="reset()">Reset</button></div>
  <div id="stats">Loading...</div>
</div>
<script src="/viewer.js"></script>
</body>
</html>

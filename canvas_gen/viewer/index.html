<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;display:flex;height:100vh;overflow:hidden;background:#1a1a2e}
#graph{flex:1;overflow:hidden;background:#1a1a2e;position:relative;cursor:grab}
#graph.dragging{cursor:grabbing}
#sidebar{width:300px;background:#16213e;color:#eee;overflow-y:auto;padding:12px;border-left:2px solid #0f3460;font-size:13px;flex-shrink:0}
#sidebar h3{color:#e94560;margin:10px 0 4px}
#sidebar label{display:block;margin:3px 0;color:#aaa;font-size:11px}
#sidebar input,#sidebar select{width:100%;padding:4px 6px;background:#0f3460;color:#eee;border:1px solid #533483;border-radius:3px;font-size:12px}
#sidebar button{background:#e94560;color:#fff;border:none;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:12px;margin:6px 4px 0 0}
#sidebar button:hover{background:#ff6b81}
.filter-row{display:flex;gap:4px;margin:3px 0;align-items:center}
.filter-row select,.filter-row input{flex:1}
.filter-row .logic{width:36px;text-align:center;color:#e94560;font-size:10px}
#stats{color:#aaa;font-size:11px;margin:6px 0}
#zoom-info{position:absolute;bottom:8px;left:8px;background:#0008;color:#fff;padding:2px 8px;border-radius:3px;font-size:11px;pointer-events:none;z-index:10}
.edge-path{fill:none;stroke-width:1.5;opacity:.6}
.edge-path:hover{stroke-width:3;opacity:1}
.edge-label{font-size:9px;pointer-events:none}
.node-rect{transition:width .2s,height .2s,x .2s,y .2s}
.node-rect:hover{opacity:.85}
.node-rect.expanded{opacity:1}
.node-text{pointer-events:none;font-family:sans-serif}
.node-body{pointer-events:none;font-family:sans-serif;font-size:10px}
</style>
</head>
<body>
<div id="graph"></div>
<div id="sidebar">
  <h3>Filter</h3>
  <div id="filter-rows"></div>
  <button onclick="addRow('filter-rows')">+ Filter</button>
  <h3>Exclude</h3>
  <div id="exclude-rows"></div>
  <button onclick="addRow('exclude-rows')">+ Exclude</button>
  <h3>Sort</h3>
  <select id="sort-key"><option value="">none</option></select>
  <label style="display:inline;margin-left:6px"><input type="checkbox" id="sort-desc"> desc</label>
  <h3>Prune</h3>
  <label><input type="checkbox" id="prune-orphans"> Remove orphans</label>
  <div style="margin-top:10px"><button onclick="apply()">Apply</button><button onclick="reset()">Reset</button></div>
  <div id="stats">Loading...</div>
</div>

<script>
const API = '/api/filter';
let ALL_NODES = [], ALL_EDGES = [], VAULT = {};
let currentNodes = [], currentEdges = [];

// Pan/zoom state
let panX = 0, panY = 0, zoom = 1;
let dragging = false, dragStartX = 0, dragStartY = 0;
let expandedId = null;

async function init() {
  const res = await fetch('/api/data');
  const data = await res.json();
  ALL_NODES = data.nodes; ALL_EDGES = data.edges; VAULT = data.vault;
  currentNodes = ALL_NODES; currentEdges = ALL_EDGES;
  render();
  addRow('filter-rows');

  const keys = new Set();
  Object.values(VAULT).forEach(v => { if (v.props) Object.keys(v.props).forEach(k => keys.add(k)); });
  const sel = document.getElementById('sort-key');
  [...keys].sort().forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
}

function nodeStem(n) { return (n.file||'').replace('.md','').split('/').pop(); }
function nodeTitle(n) { const stem = nodeStem(n); return (VAULT[stem]?.props?.title) || stem; }

// ═══════════ RENDER ═══════════

function render() {
  const graph = document.getElementById('graph');
  graph.innerHTML = '';

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');

  let maxX = 200, maxY = 200;
  currentNodes.forEach(n => {
    const r = (n.x||0) + (n.width||200);
    const b = (n.y||0) + (n.height||120);
    if (r > maxX) maxX = r;
    if (b > maxY) maxY = b;
  });
  maxX += 60; maxY += 60;
  svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);  
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.style.width = '100%';
  svg.style.height = '100%';
  svg.style.minWidth = maxX + 'px';
  svg.style.minHeight = maxY + 'px';

  // Transform group for pan/zoom
  const mainG = document.createElementNS(svgNS, 'g');
  mainG.setAttribute('id', 'main-group');
  updateTransform(mainG);

  // Edges
  const nodeIds = new Set(currentNodes.map(n => n.id));
  currentEdges.filter(e => nodeIds.has(e.fromNode) && nodeIds.has(e.toNode)).forEach(e => {
    const fn = currentNodes.find(n => n.id === e.fromNode);
    const tn = currentNodes.find(n => n.id === e.toNode);
    if (!fn || !tn) return;
    const fw = fn.width||200, fh = fn.height||120, tw = tn.width||200, th = tn.height||120;
    const x1 = (fn.x||0)+fw/2, y1 = (fn.y||0)+fh/2, x2 = (tn.x||0)+tw/2, y2 = (tn.y||0)+th/2;
    const mx = (x1+x2)/2, my = (y1+y2)/2, ec = e.color || '#666';
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `M${x1},${y1} Q${mx+30},${my-30} ${x2},${y2}`);
    path.setAttribute('stroke', ec); path.setAttribute('class', 'edge-path');
    mainG.appendChild(path);
    if (e.label) {
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', mx); txt.setAttribute('y', my-6);
      txt.setAttribute('fill', ec); txt.setAttribute('class', 'edge-label');
      txt.setAttribute('text-anchor', 'middle'); txt.textContent = e.label;
      mainG.appendChild(txt);
    }
  });

  // Nodes
  currentNodes.forEach(n => {
    const nw = n.width||200, nh = n.height||120, nx = n.x||0, ny = n.y||0;
    const fill = n.color || '#555';
    const title = nodeTitle(n);
    const stem = nodeStem(n);
    const v = VAULT[stem];

    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('data-id', n.id);

    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', nx); rect.setAttribute('y', ny);
    rect.setAttribute('width', nw); rect.setAttribute('height', nh);
    rect.setAttribute('rx', '4'); rect.setAttribute('ry', '4');
    rect.setAttribute('fill', fill);
    rect.setAttribute('stroke', '#fff'); rect.setAttribute('stroke-width', '0.5');
    rect.setAttribute('class', 'node-rect');
    rect.setAttribute('data-id', n.id);
    rect.style.cursor = 'pointer';
    rect.onclick = (e) => { e.stopPropagation(); toggleExpand(rect, n, mainG); };

    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', nx+6); txt.setAttribute('y', ny+nh/2+4);
    txt.setAttribute('fill', '#fff');
    txt.setAttribute('font-size', Math.max(10, Math.min(14, nh/10)));
    txt.setAttribute('class', 'node-text');
    txt.textContent = title;

    g.appendChild(rect); g.appendChild(txt);
    mainG.appendChild(g);
  });

  svg.appendChild(mainG);
  graph.appendChild(svg);

  // Existing expanded body g (re-created on toggle)
  expandedId = null;

  // Pan/zoom handlers
  graph.onmousedown = (e) => {
    if (e.target === svg || e.target === mainG || e.target === graph) {
      dragging = true; dragStartX = e.clientX - panX; dragStartY = e.clientY - panY;
      graph.classList.add('dragging'); e.preventDefault();
    }
  };
  window.onmousemove = (e) => {
    if (!dragging) return;
    panX = e.clientX - dragStartX; panY = e.clientY - dragStartY;
    updateTransform(mainG);
  };
  window.onmouseup = () => { dragging = false; graph.classList.remove('dragging'); };

  graph.onwheel = (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const mx = e.clientX - graph.getBoundingClientRect().left;
    const my = e.clientY - graph.getBoundingClientRect().top;
    const newZoom = Math.max(0.1, Math.min(5, zoom * delta));
    panX = mx - (mx - panX) * (newZoom / zoom);
    panY = my - (my - panY) * (newZoom / zoom);
    zoom = newZoom;
    updateTransform(mainG);
    updateZoomInfo();
  };

  updateZoomInfo();
  document.getElementById('stats').textContent = `Nodes: ${currentNodes.length} | Edges: ${currentEdges.length}`;
}

function updateTransform(g) {
  g.setAttribute('transform', `translate(${panX},${panY}) scale(${zoom})`);
}

function updateZoomInfo() {
  let el = document.getElementById('zoom-info');
  if (!el) {
    el = document.createElement('div'); el.id = 'zoom-info';
    document.getElementById('graph').appendChild(el);
  }
  el.textContent = `${Math.round(zoom*100)}%`;
}

// ═══════════ CLICK-EXPAND (in-place) ═══════════

function toggleExpand(rect, node, mainG) {
  const nid = node.id;

  // Collapse previous
  if (expandedId && expandedId !== nid) {
    collapseNode(expandedId, mainG);
  }

  if (expandedId === nid) {
    collapseNode(nid, mainG);
    expandedId = null;
    return;
  }

  expandedId = nid;
  const expW = 420, expH = 320;
  const nx = node.x||0, ny = node.y||0;
  rect.setAttribute('width', expW);
  rect.setAttribute('height', expH);
  rect.classList.add('expanded');

  const stem = nodeStem(node);
  const v = VAULT[stem];
  if (!v) return;

  const g = rect.parentNode;
  if (!g) return;

  // Remove old body
  const old = g.querySelector('.node-body');
  if (old) old.remove();

  // Add body text
  const bodyLines = [];
  if (v.props?.title) bodyLines.push({t: 'h', text: v.props.title});
  if (v.props) {
    Object.entries(v.props).forEach(([k,val]) => {
      if (k === 'title' || k === 'type') return;
      bodyLines.push({t: 'p', text: `${k}: ${Array.isArray(val) ? val.join(', ') : val}`});
    });
  }
  if (v.body) {
    bodyLines.push({t: 'hr'});
    const lines = v.body.split('\n');
    for (const line of lines) {
      const t = line.trim();
      if (!t) { bodyLines.push({t: 'br'}); continue; }
      if (t.startsWith('#')) bodyLines.push({t: 'h', text: t.replace(/^#+\s*/, '')});
      else if (t.startsWith('>')) bodyLines.push({t: 'q', text: t.slice(1).trim()});
      else if (t.startsWith('```')) { bodyLines.push({t: 'code'}); continue; }
      else bodyLines.push({t: 'p', text: t});
    }
  }

  // Render body as SVG text elements
  let cy = ny + 22;
  const wrapWidth = expW - 16;
  bodyLines.forEach(line => {
    let fontSize = 10, fill = '#ddd';
    if (line.t === 'h') { fontSize = 13; fill = '#e94560'; }
    else if (line.t === 'hr') { cy += 4; return; }
    else if (line.t === 'br') { cy += 10; return; }
    else if (line.t === 'code') return;
    else if (line.t === 'q') { fill = '#aaa'; }

    if (line.text) {
      const chunkSize = Math.floor(wrapWidth / (fontSize * 0.65));
      const chunks = [];
      for (let i = 0; i < line.text.length; i += chunkSize) {
        chunks.push(line.text.slice(i, i + chunkSize));
      }
      chunks.forEach(chunk => {
        if (cy > ny + expH - 8) return;
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', nx + 8); t.setAttribute('y', cy);
        t.setAttribute('fill', fill); t.setAttribute('font-size', fontSize);
        t.setAttribute('class', 'node-body');
        t.textContent = chunk;
        g.appendChild(t);
        cy += fontSize + 4;
      });
    }
  });
}

function collapseNode(nid, mainG) {
  const nodeData = currentNodes.find(n => n.id === nid);
  if (!nodeData) return;
  const rect = mainG.querySelector(`rect[data-id="${nid}"]`);
  if (rect) {
    rect.setAttribute('width', nodeData.width||200);
    rect.setAttribute('height', nodeData.height||120);
    rect.classList.remove('expanded');
  }
  const g = rect?.parentNode;
  if (g) g.querySelectorAll('.node-body').forEach(el => el.remove());
}

// ═══════════ FILTER GUI ═══════════

function addRow(cid) {
  const div = document.getElementById(cid);
  const row = document.createElement('div'); row.className = 'filter-row';
  const logic = document.createElement('span'); logic.className = 'logic';
  logic.textContent = div.children.length ? 'AND' : 'WHERE';
  const sel = document.createElement('select');
  sel.innerHTML = '<option value="$or">$or</option>';
  const keys = new Set();
  Object.values(VAULT).forEach(v => { if (v.props) Object.keys(v.props).forEach(k => keys.add(k)); });
  [...keys].sort().forEach(k => { sel.innerHTML += `<option value="${k}">${k}</option>`; });
  const inp = document.createElement('input'); inp.placeholder = 'value or val1|val2';
  const del = document.createElement('button'); del.textContent = 'x';
  del.style.background = '#533483'; del.style.padding = '2px 6px'; del.onclick = () => row.remove();
  row.appendChild(logic); row.appendChild(sel); row.appendChild(inp); row.appendChild(del);
  div.appendChild(row);
}

function buildFilterStr(cid) {
  const pairs = [];
  document.getElementById(cid).querySelectorAll('.filter-row').forEach(r => {
    const s = r.querySelector('select'), i = r.querySelector('input');
    if (s && i && i.value.trim()) pairs.push(s.value + '=' + i.value.trim());
  });
  return pairs.join(',');
}

async function apply() {
  const params = {
    filter: buildFilterStr('filter-rows'),
    exclude: buildFilterStr('exclude-rows'),
    sortKey: document.getElementById('sort-key').value,
    sortDesc: document.getElementById('sort-desc').checked,
    prune: document.getElementById('prune-orphans').checked,
  };
  const res = await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(params) });
  const data = await res.json();
  currentNodes = data.nodes; currentEdges = data.edges;
  panX = 0; panY = 0; zoom = 1; expandedId = null;
  render();
}

function reset() {
  document.getElementById('filter-rows').innerHTML = '';
  document.getElementById('exclude-rows').innerHTML = '';
  document.getElementById('sort-key').value = '';
  document.getElementById('sort-desc').checked = false;
  document.getElementById('prune-orphans').checked = false;
  currentNodes = ALL_NODES; currentEdges = ALL_EDGES;
  panX = 0; panY = 0; zoom = 1; expandedId = null;
  render();
  addRow('filter-rows');
}

init();
</script>
</body>
</html>

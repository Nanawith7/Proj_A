<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;display:flex;height:100vh;overflow:hidden;background:#1a1a2e}
#graph{flex:1;position:relative;overflow:auto;background:#1a1a2e}
#graph svg{display:block;min-width:100%;min-height:100%}
#sidebar{width:320px;background:#16213e;color:#eee;overflow-y:auto;padding:12px;border-left:2px solid #0f3460;font-size:13px;flex-shrink:0}
#sidebar h3{color:#e94560;margin:8px 0 4px}
#sidebar label{display:block;margin:2px 0;color:#aaa;font-size:11px}
#sidebar input,#sidebar select{width:100%;padding:4px 6px;background:#0f3460;color:#eee;border:1px solid #533483;border-radius:3px;font-size:12px}
#sidebar button{background:#e94560;color:#fff;border:none;padding:6px 14px;border-radius:3px;cursor:pointer;font-size:12px;margin:8px 4px 0 0}
#sidebar button:hover{background:#ff6b81}
#sidebar .filter-row{display:flex;gap:4px;margin:3px 0;align-items:center}
#sidebar .filter-row select{flex:1}
#sidebar .filter-row input{flex:1}
#sidebar .filter-row .logic{width:42px;text-align:center;color:#e94560;font-size:10px}
#stats{color:#aaa;font-size:11px;margin:4px 0}
.expanded{position:absolute;background:#1e1e3a;border:2px solid #e94560;border-radius:6px;padding:12px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:500px;max-height:400px;overflow-y:auto;color:#ddd;font-size:12px}
.expanded h1,.expanded h2{color:#e94560;font-size:14px}
.expanded .prop{display:inline-block;padding:2px 6px;margin:2px;border-radius:3px;font-size:11px}
.edge-path{fill:none;stroke-width:1.5;opacity:.6}
.edge-path:hover{stroke-width:3;opacity:1}
.edge-label{font-size:10px;fill:#aaa}
</style>
</head>
<body>
<div id="graph"></div>
<div id="sidebar">
  <h3>Filter</h3>
  <div id="filter-rows"></div>
  <button onclick="addFilterRow('filter-rows')">+ Filter</button>
  <h3>Exclude</h3>
  <div id="exclude-rows"></div>
  <button onclick="addFilterRow('exclude-rows')">+ Exclude</button>
  <h3>Sort</h3>
  <select id="sort-key"><option value="">none</option></select>
  <label style="display:inline;margin-left:8px"><input type="checkbox" id="sort-desc"> desc</label>
  <h3>Options</h3>
  <label><input type="checkbox" id="prune-orphans"> Prune orphans</label>
  <div style="margin-top:8px"><button onclick="applyFilters()">Apply</button><button onclick="resetAll()">Reset</button></div>
  <div id="stats">Nodes: 0 | Edges: 0</div>
</div>

<script>
// ═══════════════ DATA ═══════════════
const DATA = JSON.parse(/*__VAULT_DATA_PLACEHOLDER__*/);
const ALL_NODES = DATA.canvas.nodes || [];
const ALL_EDGES = DATA.canvas.edges || [];
const VAULT = DATA.vault || {};
const ICONS = DATA.icons || {};
const STYLE = DATA.style || {};

const FILE_NODES = ALL_NODES.filter(n => n.id.indexOf('_icon') === -1);
const FILE_BY_ID = {}; FILE_NODES.forEach(n => FILE_BY_ID[n.id] = n);

function nodeType(n) { const f=n.file||''; const p=f.split('/')[0]; return (p&&p!==f)?p:((VAULT[f.replace('.md','').split('/').pop()]||{}).props||{}).type||'default'; }
function nodeStem(n) { return (n.file||'').replace('.md','').split('/').pop(); }

// ═══════════════ FILTER ENGINE ═══════════════
function matchCond(nd, key, expected) {
  if (key === '$or' && Array.isArray(expected)) return expected.some(c => Object.entries(c).every(([k,v]) => matchCond(nd,k,v)));
  const v = VAULT[nodeStem(nd)]; if (!v) return false;
  const actual = (v.props||{})[key]; if (actual === undefined || actual === null) return false;
  if (Array.isArray(actual)) { if (actual.includes(expected)) return true; return actual.includes('[['+expected+']]'); }
  if (Array.isArray(expected)) { if (expected.includes(actual)) return true; const s = actual.startsWith('[[')&&actual.endsWith(']]')?actual.slice(2,-2):null; return !!s&&expected.includes(s); }
  if (actual === expected) return true;
  if (typeof actual==='string' && actual.startsWith('[[') && actual.endsWith(']]')) return actual.slice(2,-2)===expected;
  if (typeof expected==='string' && expected.startsWith('[[') && expected.endsWith(']]')) return actual===expected.slice(2,-2);
  return false;
}
function cloneNode(n) { return Object.assign({}, n, {_stem: nodeStem(n)}); }
function applyFilter(nodes, conds) { if (!conds||!Object.keys(conds).length) return nodes; return nodes.filter(n => Object.entries(conds).every(([k,v]) => matchCond(n,k,v))); }
function applyExclude(nodes, conds) { if (!conds||!Object.keys(conds).length) return nodes; return nodes.filter(n => !Object.entries(conds).every(([k,v]) => matchCond(n,k,v))); }
function applySort(nodes, key, desc) { if (!key) return nodes; return [...nodes].sort((a,b) => { const va=(VAULT[a._stem]?.props||{})[key]??''; const vb=(VAULT[b._stem]?.props||{})[key]??''; if (va<vb) return desc?1:-1; if (va>vb) return desc?-1:1; return 0; }); }
function pruneEdgeless(nodes, edges) { const c=new Set(); edges.forEach(e => { c.add(e.fromNode); c.add(e.toNode); }); return nodes.filter(n => c.has(n.id)); }
function parseConds(raw) { if (!raw) return {}; const r={}; raw.split(',').forEach(p => { const eq=p.indexOf('='); if (eq>0) { const k=p.slice(0,eq).trim(); let v=p.slice(eq+1).trim().replace(/^["']|["']$/g,''); if (v.includes('|')) v=v.split('|').map(s=>s.trim()); if (r[k]) { if (Array.isArray(r[k])) r[k].push(...(Array.isArray(v)?v:[v])); else r[k]=[r[k],...(Array.isArray(v)?v:[v])]; } else r[k]=v; } }); return r; }
function runPipeline(nodes, edges, cfg) {
  let n = nodes.map(cloneNode);
  if (cfg.filterStr) n = applyFilter(n, parseConds(cfg.filterStr));
  if (cfg.excludeStr) n = applyExclude(n, parseConds(cfg.excludeStr));
  n = applySort(n, cfg.sortKey, cfg.sortDesc);
  if (cfg.prune) n = pruneEdgeless(n, edges);
  const ids = new Set(n.map(x => x.id));
  return { nodes: n, edges: edges.filter(e => ids.has(e.fromNode) && ids.has(e.toNode)) };
}

// ═══════════════ RENDER ═══════════════
const graph = document.getElementById('graph');
let expandedNode = null;

function iconUrl(n) { const f = n.file||''; if (f.startsWith('_icons/')) { const nm = f.split('/').pop(); if (ICONS[nm]) return ICONS[nm]; } return null; }

function renderGraph(nodes, edges) {
  graph.innerHTML = '';

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');

  let maxX = 100, maxY = 100;
  nodes.forEach(n => { const r = (n.x||0)+(n.width||200); const b = (n.y||0)+(n.height||120); if (r>maxX) maxX=r; if (b>maxY) maxY=b; });
  maxX += 100; maxY += 100;
  svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);
  svg.style.width = maxX + 'px';
  svg.style.height = maxY + 'px';

  // Edges
  const gEdges = document.createElementNS(svgNS, 'g');
  const nodeIds = new Set(nodes.map(n => n.id));
  edges.filter(e => nodeIds.has(e.fromNode) && nodeIds.has(e.toNode)).forEach(e => {
    const fn = nodes.find(n => n.id === e.fromNode);
    const tn = nodes.find(n => n.id === e.toNode);
    if (!fn || !tn) return;
    const fw = fn.width||200, fh = fn.height||120, tw = tn.width||200, th = tn.height||120;
    const x1 = (fn.x||0) + fw/2, y1 = (fn.y||0) + fh/2;
    const x2 = (tn.x||0) + tw/2, y2 = (tn.y||0) + th/2;
    const mx = (x1+x2)/2, my = (y1+y2)/2;

    const path = document.createElementNS(svgNS, 'path');
    const ec = e.color || '#666';
    path.setAttribute('d', `M${x1},${y1} Q${mx+30},${my-30} ${x2},${y2}`);
    path.setAttribute('stroke', ec);
    path.setAttribute('class', 'edge-path');
    gEdges.appendChild(path);

    if (e.label) {
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', mx); txt.setAttribute('y', my-6);
      txt.setAttribute('fill', ec); txt.setAttribute('class', 'edge-label');
      txt.textContent = e.label;
      gEdges.appendChild(txt);
    }
  });
  svg.appendChild(gEdges);

  // Nodes
  const gNodes = document.createElementNS(svgNS, 'g');
  nodes.forEach(n => {
    const g = document.createElementNS(svgNS, 'g');
    const nw = n.width||200, nh = n.height||120;
    const nx = n.x||0, ny = n.y||0;
    const icn = iconUrl(n);
    const type = nodeType(n);
    const ts = (STYLE.types||{})[type]||{};
    const fill = n.color || ts.bg || '#555';
    const stem = nodeStem(n);
    const title = (VAULT[stem]?.props?.title) || stem;
    const nv = ts.nodeview ? (window._allNodeviews || {})[ts.nodeview] || {} : {};
    const children = nodeViewToChildren(nv, VAULT[stem] || {});

    if (children && children.children.length > 0) {
      // ── New children rendering path (drawElement-based) ──
      children._ax = nx; children._ay = ny;
      children._cw = null; children._ch = null;
      computeChildrenLayout(children);

      // Update node dimensions from computed layout (don't override if computed is bigger)
      if (!nw || nw <= 0) nw = children._cw || 200;
      if (!nh || nh <= 0) nh = children._ch || 120;
      if (children._cw > 0 && children._cw < nw) nw = children._cw;
      if (children._ch > 0 && children._ch < nh) nh = children._ch;

      const childrenW = children._cw || nw, childrenH = children._ch || nh;
      const shape = nv.shape || 'rect';
      const parentRect = document.createElementNS(svgNS, 'rect');
      parentRect.setAttribute('x', nx); parentRect.setAttribute('y', ny);
      parentRect.setAttribute('width', childrenW); parentRect.setAttribute('height', childrenH);
      parentRect.setAttribute('rx', shape === 'circle' ? Math.min(childrenW, childrenH) / 2 : 4);
      parentRect.setAttribute('ry', shape === 'circle' ? Math.min(childrenW, childrenH) / 2 : 4);
      parentRect.setAttribute('fill', fill); parentRect.setAttribute('stroke', '#fff6');
      parentRect.setAttribute('stroke-width', 0.5);
      parentRect.style.cursor = 'pointer';
      parentRect.onclick = () => toggleExpand(n);
      g.appendChild(parentRect);

      // Title
      const tTxt = document.createElementNS(svgNS, 'text');
      tTxt.setAttribute('x', nx + 6); tTxt.setAttribute('y', ny + childrenH / 2 + 4);
      tTxt.setAttribute('fill', ts.textColor || '#fff');
      tTxt.setAttribute('font-size', Math.max(10, Math.min(14, childrenH / 10)));
      tTxt.textContent = title.length > 20 ? title.slice(0, 18) + '..' : title;
      g.appendChild(tTxt);

      // Icon
      if (icn) {
        const img = document.createElementNS(svgNS, 'image');
        img.setAttribute('href', icn);
        img.setAttribute('x', nx); img.setAttribute('y', ny);
        img.setAttribute('width', 28); img.setAttribute('height', 28);
        g.appendChild(img);
      }

      // Draw children rects via drawElement()
      children._ax = 0; children._ay = 0;
      for (const child of children.children) {
        drawElement(child, g, nx, ny);
      }
      gNodes.appendChild(g);
    } else {
      // ── Existing rendering path ──
      // Icon image
      if (icn) {
        const sz = 28;
        const img = document.createElementNS(svgNS, 'image');
        img.setAttribute('href', icn);
        img.setAttribute('x', nx); img.setAttribute('y', ny);
        img.setAttribute('width', sz); img.setAttribute('height', sz);
        g.appendChild(img);
      }

      // Node rect
      const rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('x', nx); rect.setAttribute('y', ny);
      rect.setAttribute('width', nw); rect.setAttribute('height', nh);
      const shape = ts.shape || 'rect';
      rect.setAttribute('rx', shape==='circle' ? Math.min(nw,nh)/2 : 4);
      rect.setAttribute('ry', shape==='circle' ? Math.min(nw,nh)/2 : 4);
      rect.setAttribute('fill', fill);
      rect.setAttribute('stroke', '#fff'); rect.setAttribute('stroke-width', 0.5);
      rect.style.cursor = 'pointer';

      // Title text
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', nx + 6); txt.setAttribute('y', ny + nh/2 + 4);
      txt.setAttribute('fill', ts.textColor || '#fff');
      txt.setAttribute('font-size', Math.max(10, Math.min(14, nh/10)));
      txt.setAttribute('font-family', ts.font || 'sans-serif');
      txt.textContent = title.length > 20 ? title.slice(0,18)+'..' : title;

      rect.onclick = () => toggleExpand(n);
      g.appendChild(rect);
      g.appendChild(txt);
      gNodes.appendChild(g);
    }
  });
  svg.appendChild(gNodes);
  graph.appendChild(svg);

  document.getElementById('stats').textContent = `Nodes: ${nodes.length} | Edges: ${edges.length}`;
}

function toggleExpand(node) {
  const ex = document.getElementById('expanded-panel');
  if (ex) { if (ex.dataset.nodeId === node.id) { ex.remove(); expandedNode=null; return; } ex.remove(); }
  expandedNode = node;
  const stem = nodeStem(node);
  const v = VAULT[stem];
  const panel = document.createElement('div');
  panel.id = 'expanded-panel';
  panel.className = 'expanded';
  panel.dataset.nodeId = node.id;
  const nx = (node.x||0) + (node.width||200);
  const ny = (node.y||0);
  panel.style.left = Math.min(nx+10, window.innerWidth-520) + 'px';
  panel.style.top = Math.min(ny, window.innerHeight-420) + 'px';

  let html = '';
  if (v?.props?.title) html += `<h2>${v.props.title}</h2>`;
  if (v?.props) {
    Object.entries(v.props).forEach(([k,val]) => { if (k==='title') return; const display = Array.isArray(val) ? val.join(', ') : String(val); html += `<span class="prop" style="background:#333;color:#aaa;border:1px solid #555">${k}: ${display}</span>`; });
    html += '<hr style="border-color:#333;margin:8px 0">';
  }
  if (v?.body && typeof marked !== 'undefined') html += marked.parse(v.body);
  else if (v?.body) html += `<pre>${v.body}</pre>`;
  panel.innerHTML = html;
  graph.appendChild(panel);
}

// ═══════════════ GUI ═══════════════
(function initSortKeys() {
  const keys = new Set(); Object.values(VAULT).forEach(v => { if (v.props) Object.keys(v.props).forEach(k => keys.add(k)); });
  const sel = document.getElementById('sort-key');
  [...keys].sort().forEach(k => { const o = document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); });
})();

function addFilterRow(cid) {
  const div = document.getElementById(cid);
  const row = document.createElement('div'); row.className = 'filter-row';
  const s = document.createElement('span'); s.className='logic'; s.textContent=div.children.length?'AND':'WHERE';
  const k = document.createElement('select'); k.innerHTML='<option value="$or">$or</option>';
  const keys = new Set(); Object.values(VAULT).forEach(v=>{if(v.props)Object.keys(v.props).forEach(x=>keys.add(x));});
  [...keys].sort().forEach(x=>{k.innerHTML+=`<option value="${x}">${x}</option>`;});
  const inp = document.createElement('input'); inp.placeholder='value or val|val2';
  const del = document.createElement('button'); del.textContent='x'; del.style.background='#533483'; del.style.padding='2px 6px'; del.onclick=()=>row.remove();
  row.appendChild(s); row.appendChild(k); row.appendChild(inp); row.appendChild(del);
  div.appendChild(row);
}

function buildFilterStr(cid) {
  const pairs = []; document.getElementById(cid).querySelectorAll('.filter-row').forEach(r => {
    const sel=r.querySelector('select'),inp=r.querySelector('input');
    if (sel&&inp&&inp.value.trim()) pairs.push(sel.value+'='+inp.value.trim());
  }); return pairs.join(',');
}

// ═══ NodeView → Children Conversion ═══
function nodeViewToChildren(nv, nodeData) {
  if (!nv.properties || typeof nv.properties !== 'object') return null;
  const hasProps = Object.keys(nv.properties).some(k => nodeData.props && k in nodeData.props);
  if (!hasProps) return null;
  const padX = 10, padY = 8, gap = 5;
  const cpX = nv.layout?.contentPadX ?? padX;
  const cpY = nv.layout?.contentPadY ?? padY;
  const rootLabel = nodeData.props?.title || '';
  const rootFontSize = nv.fontSize || 12;
  const root = {
    label: rootLabel, shape: nv.shape || 'rect', rx: nv.rx || 4,
    stroke: nv.stroke || '#fff6', strokeWidth: nv.strokeWidth ?? 0.5,
    fill: '#ffffff22', text: rootLabel, fontSize: rootFontSize,
    textColor: '#ffffffcc', w: null, h: null, gapY: gap, children: []
  };
  for (const [key, propDef] of Object.entries(nv.properties)) {
    const rawVal = nodeData.props[key];
    if (rawVal === undefined || rawVal === null) continue;
    const items = Array.isArray(rawVal) ? rawVal.map(v => String(v).replace(/^\[\[|\]\]$/g, '')) : [String(rawVal).replace(/^\[\[|\]\]$/g, '')];
    if (propDef.style === 'pill' && items.length > 0) {
      const pillY = typeof propDef.position?.y === 'string' && propDef.position.y.endsWith('%')
        ? Math.round(parseFloat(propDef.position.y)) : (Number(propDef.position?.y) ?? 0) + cpY;
      const pill = {
        label: key, shape: propDef.shape === 'diamond' ? 'rect' : 'rect',
        rx: propDef.shape === 'diamond' ? 4 : (propDef.shape === 'round' ? 10 : 3),
        fill: propDef.bg || '#fff2', stroke: '#0000', strokeWidth: 0,
        text: items[0], textColor: propDef.textColor || '#eee', fontSize: 11,
        w: null, h: null,
        xRel: !!propDef.position?.x ? ('left-' + (Number(propDef.position.x) ?? 10)) : null,
        yRel: 'top-' + Math.max(pillY, cpY)
      };
      root.children.push(pill);
    }
  }
  if (root.children.length === 0) return null;
  return root;
}

function resolvePosChild(raw, total, defaultVal) {
  if (raw === null || raw === undefined || raw === '') return defaultVal;
  if (typeof raw === 'string' && raw.endsWith('%')) return parseFloat(raw) / 100 * total;
  return parseFloat(raw);
}

const _measureText = function(text, fontSize) { return window._measureCtx ? (window._measureCtx.font = fontSize + 'px sans-serif', window._measureCtx.measureText(text).width) : text.length * fontSize * 0.6; };
window._measureCtx = document.createElement('canvas').getContext('2d');

function _wrapText(text, maxW, fontSize) {
  const lines = []; let pos = 0;
  while (pos < text.length) {
    let len = 1;
    const ctx = window._measureCtx; ctx.font = fontSize + 'px sans-serif';
    while (pos + len <= text.length && ctx.measureText(text.slice(pos, pos + len)).width < maxW) len++;
    if (len === 1 && pos + 1 <= text.length) len = 2;
    lines.push(text.slice(pos, pos + len - 1));
    pos += len - 1;
  }
  return lines;
}

function measureElement(el) {
  if (el._cw > 0 && el._ch > 0) return;
  const padX = 10, padY = 8, gap = el.gapY || 5;
  if (el.w !== null && el.h !== null) { el._cw = Math.max(el.w, 20); el._ch = Math.max(el.h, 20); return; }
  let maxChildW = 0, maxChildHForHeight = 0;
  if (el.children && el.children.length > 0) {
    for (const child of el.children) { measureElement(child); const cw = child._cw || 0, ch = child._ch || 0; if (cw > maxChildW) maxChildW = cw; if (ch > maxChildHForHeight) maxChildHForHeight = ch; }
  }
  let textW = 0, textH = 0;
  if (el.text) {
    const fontSize = el.fontSize || 12, tw = window._measureText ? window._measureText(el.text, fontSize) : el.text.length * fontSize * 0.6;
    textW = tw; textH = (fontSize + 4) + padY * 2;
  }
  const w = el.w !== null ? Math.max(el.w, 20) : Math.max(maxChildW, textW) + padX * 2;
  const h = el.h !== null ? Math.max(el.h, 20) : Math.max(maxChildHForHeight + padY * 2, textH);
  el._cw = w; el._ch = h;
}

function resolvePositions(el) {
  if (!el.children || el.children.length === 0) return;
  const padX = 10, padY = 8;
  for (const child of el.children) { if (child._cw <= 0 && child._ch <= 0) measureElement(child); }
  let curY = el._ay !== undefined ? el._ay + padY : padY;
  for (const child of el.children) {
    child._ax = child.xRel ? resolvePosChild(child.xRel, el._cw, 10) : (el._cw - (child._cw || 0)) / 2;
    if (child.yRel) { const val = resolvePosChild(child.yRel, el._ch, undefined); child._ay = val !== undefined && !isNaN(val) ? (el._ay !== undefined ? el._ay + val : val) : curY; if (!child.yRel || resolvePosChild(child.yRel, el._ch, undefined) === undefined) curY += (child._ch || 0) + (el.gapY || 5); } else { child._ay = curY; curY += (child._ch || 0) + (el.gapY || 5); }
  }
  let maxBottom = 0;
  for (const child of el.children) { const cb = child._ay + (child._ch || 0); if (cb > maxBottom) maxBottom = cb; }
  if (el.w === null) { let maxRight = 0; for (const child of el.children) { const cr = child._ax + (child._cw || 0); if (cr > maxRight) maxRight = cr; } el._cw = Math.max(maxRight, el._cw) + padX * 2; }
  if (el.h === null) { el._ch = Math.max(maxBottom, 1) + padY * 2; }
}

function computeChildrenLayout(el) {
  for (let i = 0; i < 3; i++) { measureElement(el); resolvePositions(el); }
}

function drawElement(parentEl, parentGroup, ox, oy) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const px = (ox || 0) + (parentEl._ax || 0);
  const py = (oy || 0) + (parentEl._ay || 0);
  const cw = parentEl._cw || 0;
  const ch = parentEl._ch || 0;
  const padX = 10, padY = 8;
  const g = document.createElementNS(svgNS, 'g');
  g.classList.add('el-group');
  g.dataset.id = parentEl.label || parentEl.id;
  const rect = document.createElementNS(svgNS, 'rect');
  rect.setAttribute('x', px); rect.setAttribute('y', py);
  rect.setAttribute('width', cw); rect.setAttribute('height', ch);
  rect.setAttribute('rx', parentEl.shape === 'circle' ? 999 : (parentEl.rx || 4));
  rect.setAttribute('ry', parentEl.shape === 'circle' ? 999 : (parentEl.rx || 4));
  rect.setAttribute('fill', parentEl.fill || '#ffffff22');
  rect.setAttribute('stroke', parentEl.stroke || '#fff6');
  rect.setAttribute('stroke-width', parentEl.strokeWidth ?? 1.5);
  g.appendChild(rect);
  if (parentEl.text && (parentEl.w === null || !parentEl.children)) {
    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', px + padX);
    txt.setAttribute('y', py + padY + ((parentEl.fontSize || 12) + 4));
    txt.setAttribute('fill', parentEl.textColor || '#ffffffcc');
    txt.setAttribute('font-size', parentEl.fontSize || 12);
    txt.textContent = parentEl.text;
    g.appendChild(txt);
  }
  if (parentEl.children && parentEl.children.length > 0) {
    for (const child of parentEl.children) {
      drawElement(child, g, px, py);
    }
  }
  parentGroup.appendChild(g);
}

function applyFilters() {
  const cfg = {
    filterStr: buildFilterStr('filter-rows'),
    excludeStr: buildFilterStr('exclude-rows'),
    sortKey: document.getElementById('sort-key').value,
    sortDesc: document.getElementById('sort-desc').checked,
    prune: document.getElementById('prune-orphans').checked,
  };
  const {nodes, edges} = runPipeline(FILE_NODES, ALL_EDGES, cfg);
  renderGraph(nodes, edges);
}

function resetAll() {
  document.getElementById('filter-rows').innerHTML=''; document.getElementById('exclude-rows').innerHTML='';
  document.getElementById('sort-key').value=''; document.getElementById('sort-desc').checked=false;
  document.getElementById('prune-orphans').checked=false;
  const ex = document.getElementById('expanded-panel'); if (ex) ex.remove();
  renderGraph(FILE_NODES, ALL_EDGES);
}

// ═══ NodeView Loading ═══
async function loadNodeViewsAsync() {
  const allNodeviews = {};
  const typeDef = DATA.style?.types || {};
  const names = Object.values(typeDef).map(t => t.nodeview).filter(Boolean);
  for (const name of [...new Set(names)]) {
    try {
      const resp = await fetch('nodeview/' + name + '.json');
      if (resp.ok) allNodeviews[name] = await resp.json();
      else {
        const fallback = await fetch('/api/nodeview/' + name + '.json');
        if (fallback.ok) allNodeviews[name] = await fallback.json();
        else allNodeviews[name] = { shape: 'rect', rx: 4 };
      }
    } catch (e) { allNodeviews[name] = { shape: 'rect', rx: 4 }; }
  }
  return allNodeviews;
}

// Initial
(function init() {
  loadNodeViewsAsync().then(nv => {
    window._allNodeviews = nv;
    renderGraph(FILE_NODES, ALL_EDGES);
    addFilterRow('filter-rows');
  });
  // Fallback: render without nodeviews
  setTimeout(() => {
    if (!window._allNodeviews) {
      window._allNodeviews = {};
      renderGraph(FILE_NODES, ALL_EDGES);
      addFilterRow('filter-rows');
    }
  }, 1000);
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Nodeview Editor</title>
<link rel="stylesheet" href="/editor.css">
</head>
<body>
<div id="left">
  <h3>Templates</h3>
  <div id="template-list"><span style="color:#aaa;font-size:11px">Loading...</span></div>
  <button onclick="newTemplate()" style="margin-top:12px;background:#533483">+ New</button>
  <button onclick="importJSON()" style="margin-top:4px;background:#0f3460">Import JSON</button>
</div>

<div id="center">
  <div id="preview-section">
    <div class="preview-box"><h4>Collapsed</h4><svg id="prev-collapsed"></svg></div>
    <div class="preview-box"><h4>Expanded</h4><svg id="prev-expanded"></svg></div>
  </div>
  <div id="bottom">
    <button onclick="copyJSON()">Copy JSON</button>
    <button onclick="saveTemplate()">Save</button>
    <span id="status"></span>
  </div>
</div>

<div id="right">
  <h3>Shape</h3>
  <select id="nv-shape" onchange="updatePreview()"><option>rect</option><option>round</option><option>circle</option></select>
  <label>rx <input type="number" id="nv-rx" value="4" min="0" oninput="updatePreview()"></label>
  <label>strokeWidth <input type="number" id="nv-sw" value="1" step="0.5" oninput="updatePreview()"></label>
  <label>Stroke <input type="text" id="nv-stroke" value="#fff6" oninput="updatePreview()"></label>
  <label>fontSize <input type="number" id="nv-fs" value="12" min="8" max="24" oninput="updatePreview()"></label>

  <h3>Title</h3>
  <select id="nv-ty" onchange="updatePreview()"><option>center</option><option>top</option></select>
  <label>titleWrap <input type="checkbox" id="nv-tw" onchange="updatePreview()"></label>
  <label>titlePadX <input type="number" id="nv-tpx" value="10" min="0" oninput="updatePreview()"></label>
  <label>titlePadY <input type="number" id="nv-tpy" value="10" min="0" oninput="updatePreview()"></label>

  <h3>Opacity</h3>
  <label>collapsed <input type="range" id="nv-cfop" value="1" min="0" max="1" step="0.05" oninput="updatePreview()"></label>
  <label>expanded <input type="range" id="nv-efop" value="1" min="0" max="1" step="0.05" oninput="updatePreview()"></label>
  <label>bgOpacity <input type="range" id="nv-bgop" value="0.15" min="0" max="1" step="0.05" oninput="updatePreview()"></label>
  <label>BG Image <input type="text" id="nv-bg" placeholder="char_bg.png" oninput="updatePreview()"></label>
  <label>Load preview BG <input type="file" id="bg-file" accept="image/*" onchange="loadBGFile(this)"></label>

  <h3>Expand</h3>
  <label>minW <input type="number" id="nv-ew" value="300" oninput="updatePreview()"></label>
  <label>minH <input type="number" id="nv-eh" value="200" oninput="updatePreview()"></label>

  <h3>Padding</h3>
  <label>contentPadX <input type="number" id="nv-cpx" value="10" min="0" oninput="updatePreview()"></label>
  <label>contentPadY <input type="number" id="nv-cpy" value="10" min="0" oninput="updatePreview()"></label>

  <h3>Position &amp; Color</h3>
  <label>titleColor <input type="text" id="nv-tc" value="#e94560" oninput="updatePreview()"></label>
  <label>bodyColor <input type="text" id="nv-bc" value="#ddd" oninput="updatePreview()"></label>
  <label>Title X <input type="text" id="nv-tdx" value="" placeholder="auto" oninput="_titlePos.x=this.value;updatePreview()"></label>
  <label>Title Y <input type="text" id="nv-tdy" value="" placeholder="auto" oninput="_titlePos.y=this.value;updatePreview()"></label>
  <label>Body X <input type="text" id="nv-bdx" value="" placeholder="auto" oninput="_bodyPos.x=this.value;updatePreview()"></label>
  <label>Body Y <input type="text" id="nv-bdy" value="" placeholder="auto" oninput="_bodyPos.y=this.value;updatePreview()"></label>

  <h3>Icon</h3>
  <select id="nv-iax" onchange="updatePreview()"><option>center</option><option>left</option><option>right</option></select>
  <select id="nv-iay" onchange="updatePreview()"><option>center</option><option>top</option><option>bottom</option></select>
  <label>iconPadX <input type="number" id="nv-ipx" value="0" oninput="updatePreview()"></label>
  <label>iconPadY <input type="number" id="nv-ipy" value="0" oninput="updatePreview()"></label>

  <h3>Properties</h3>
  <div id="props-editor"></div>
  <button onclick="addProp()" style="margin-top:4px;background:#533483">+ Add Property</button>

  <h3>JSON Output</h3>
  <textarea id="json-output" readonly></textarea>
</div>
<script src="/editor-core.js"></script>
<script src="/editor-preview.js"></script>
<script src="/editor.js"></script>
</body>
</html>
